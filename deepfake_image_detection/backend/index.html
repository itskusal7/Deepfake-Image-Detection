<!DOCTYPE html>
<html>
<head>
    <title>Deepfake Image Detector</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container { 
            background: white; 
            max-width: 900px; 
            padding: 40px; 
            border-radius: 12px; 
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }
        h1 { 
            color: #333; 
            margin-bottom: 30px; 
            text-align: center;
            font-size: 2em;
        }
        .input-section { 
            background: #f8f9fa; 
            padding: 20px; 
            border-radius: 8px; 
            margin-bottom: 20px;
        }
        label { 
            display: block; 
            color: #555; 
            font-weight: 600; 
            margin-bottom: 8px;
            margin-top: 15px;
        }
        label:first-child { margin-top: 0; }
        input[type="file"],
        input[type="text"] { 
            width: 100%; 
            padding: 12px; 
            margin-bottom: 15px;
            border: 2px solid #ddd; 
            border-radius: 6px; 
            font-size: 14px;
            transition: border-color 0.3s;
        }
        input[type="file"]:focus,
        input[type="text"]:focus { 
            outline: none;
            border-color: #667eea;
        }
        button { 
            width: 100%;
            padding: 14px; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; 
            border: none; 
            border-radius: 6px; 
            font-size: 16px;
            font-weight: 600;
            cursor: pointer; 
            transition: transform 0.2s;
        }
        button:hover { transform: translateY(-2px); }
        button:active { transform: translateY(0); }
        #result { 
            padding: 15px; 
            margin: 20px 0; 
            border-radius: 6px; 
            text-align: center;
            font-weight: 600;
            display: none;
        }
        #result.success { 
            background-color: #d4edda; 
            color: #155724;
            border: 2px solid #28a745;
        }
        #result.error { 
            background-color: #f8d7da; 
            color: #721c24;
            border: 2px solid #dc3545;
        }
        #result h3 { margin-bottom: 10px; }
        .image-container { 
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 30px;
        }
        .image-box {
            text-align: center;
        }
        .image-box h4 { 
            color: #555; 
            margin-bottom: 10px;
            font-size: 14px;
        }
        img { 
            max-width: 100%; 
            height: auto;
            border: 2px solid #ddd; 
            border-radius: 6px; 
            display: none;
        }
        .loading { 
            text-align: center; 
            color: #666; 
            font-size: 16px;
        }
        .spinner {
            display: inline-block;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @media (max-width: 600px) {
            .container { padding: 20px; }
            h1 { font-size: 1.5em; }
            .image-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Deepfake Image Detector</h1>
        
        <div style="background: #e8f4f8; padding: 20px; border-radius: 8px; margin-bottom: 20px;">
            <h3 style="color: #333; margin-bottom: 15px;">📋 Choose Detection Model</h3>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px;">
                <label style="display: flex; align-items: center; cursor: pointer; padding: 12px; border: 2px solid #ddd; border-radius: 6px; background: white; transition: all 0.3s;">
                    <input type="radio" name="model" value="model1" checked style="width: 20px; height: 20px; cursor: pointer; margin-right: 10px;">
                    <div style="flex: 1;">
                        <strong style="color: #333;">Model 1: ViT Hybrid</strong>
                        <p style="font-size: 0.85em; color: #666; margin: 5px 0 0 0;">ViT + NPR with attention fusion. Fast & accurate on standard images.</p>
                    </div>
                </label>
                
                <label style="display: flex; align-items: center; cursor: pointer; padding: 12px; border: 2px solid #ddd; border-radius: 6px; background: white; transition: all 0.3s;">
                    <input type="radio" name="model" value="model2" style="width: 20px; height: 20px; cursor: pointer; margin-right: 10px;">
                    <div style="flex: 1;">
                        <strong style="color: #333;">Model 2: DNF-Based</strong>
                        <p style="font-size: 0.85em; color: #666; margin: 5px 0 0 0;">Diffusion-based features + NPR. Detects sophisticated deepfakes.</p>
                    </div>
                </label>
            </div>
            
            <div id="modelStatus" style="font-size: 0.9em; color: #666; text-align: center;">
                <span id="model1Status">✅ Model 1 on port 8000</span> | <span id="model2Status">⏳ Model 2 on port 8081</span>
            </div>
        </div>
        
        <div class="input-section">
            <label for="fileInput"><b>Option 1: Upload Image File</b></label>
            <input type="file" id="fileInput" accept="image/*">
            
            <label for="urlInput"><b>Option 2: Paste Image URL</b></label>
            <input type="text" id="urlInput" placeholder="https://example.com/image.jpg">
            
            <button onclick="predict()">🚀 Analyze Image</button>
        </div>
        
        <div id="result"></div>
        
        <div class="image-container">
            <div class="image-box">
                <h4>Original Image</h4>
                <img id="preview">
            </div>
            <div class="image-box">
                <h4>Heatmap (Attention Map)</h4>
                <img id="heatmap">
            </div>
        </div>
    </div>

    <script>
    // Check model availability
    async function checkModelStatus() {
        try {
            const res1 = await fetch("http://localhost:8000/").catch(() => null);
            document.getElementById("model1Status").textContent = res1 ? "✅ Model 1 on port 8000" : "❌ Model 1 offline";
        } catch (e) {
            document.getElementById("model1Status").textContent = "❌ Model 1 offline";
        }
        
        try {
            const res2 = await fetch("http://localhost:8081/").catch(() => null);
            document.getElementById("model2Status").textContent = res2 ? "✅ Model 2 on port 8081" : "⏳ Model 2 offline";
        } catch (e) {
            document.getElementById("model2Status").textContent = "⏳ Model 2 offline";
        }
    }
    
    checkModelStatus();
    setInterval(checkModelStatus, 5000);
    
    async function predict() {
        const fileInput = document.getElementById("fileInput");
        const urlInput = document.getElementById("urlInput").value;
        const resultDiv = document.getElementById("result");
        const selectedModel = document.querySelector('input[name="model"]:checked').value;
        
        const port = selectedModel === "model1" ? 8000 : 8081;
        const modelName = selectedModel === "model1" ? "Model 1 (ViT Hybrid)" : "Model 2 (DNF-based)";
        
        // Validation
        if (fileInput.files.length === 0 && !urlInput.trim()) {
            showError("Please upload a file or paste an image URL");
            return;
        }
        
        if (urlInput && !urlInput.trim().startsWith("http")) {
            showError("URL must start with http:// or https://");
            return;
        }
        
        resultDiv.innerHTML = `<div class="loading"><span class="spinner">⏳</span> Analyzing with ${modelName}...</div>`;
        resultDiv.style.display = "block";
        
        try {
            let formData = new FormData();
            
            if (fileInput.files.length > 0) {
                formData.append("file", fileInput.files[0]);
            } else if (urlInput.trim()) {
                formData.append("image_url", urlInput);
            }
            
            const response = await fetch(`http://localhost:${port}/predict`, {
                method: "POST",
                body: formData
            });
            
            if (!response.ok) {
                const errorData = await response.json().catch(() => ({}));
                showError(`${modelName} Error: ${errorData.detail || response.statusText}`);
                return;
            }
            
            const data = await response.json();
            
            // Show result
            const confidence = (data.confidence * 100).toFixed(2);
            const resultClass = data.prediction === "FAKE" ? "error" : "success";
            const emoji = data.prediction === "FAKE" ? "⚠️" : "✅";
            resultDiv.innerHTML = `
                <div style="margin-bottom: 10px; font-size: 2em;">${emoji}</div>
                <h3>${data.prediction}</h3>
                <p><strong>Confidence:</strong> ${confidence}%</p>
                <p style="font-size: 0.85em; color: #999; margin-top: 5px;"><em>Using: ${modelName}</em></p>
                <p style="font-size: 0.9em; margin-top: 10px; color: #666;">${data.interpretation || ""}</p>
            `;
            resultDiv.className = resultClass;
            resultDiv.style.display = "block";
            
            // Show images
            if (fileInput.files.length > 0) {
                document.getElementById("preview").src = URL.createObjectURL(fileInput.files[0]);
            } else if (urlInput) {
                document.getElementById("preview").src = urlInput;
            }
            document.getElementById("preview").style.display = "block";
            
            // Show heatmap
            if (data.heatmap) {
                document.getElementById("heatmap").src = "data:image/png;base64," + data.heatmap;
                document.getElementById("heatmap").style.display = "block";
            }
            
        } catch (error) {
            showError(`Network Error: ${error.message}<br><small>Make sure both backends are running:<br>Port 8000: python main.py<br>Port 8081: python model2.py</small>`);
        }
    }
    
    function showError(message) {
        const resultDiv = document.getElementById("result");
        resultDiv.innerHTML = `<p>${message}</p>`;
        resultDiv.className = "error";
        resultDiv.style.display = "block";
    }
    </script>
</body>
</html>
